name: mobile_app
description: "AI-powered real-time fitness tracker with on-device pose estimation."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  google_mlkit_pose_detection: ^0.12.0
  google_mlkit_commons: ^0.7.0
  cupertino_icons: ^1.0.6
  google_sign_in: ^6.2.1
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

